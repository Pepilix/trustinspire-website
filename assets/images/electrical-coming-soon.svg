<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#f1eee8" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1500" height="1000" fill="#2c2829"/>
  <rect width="1500" height="1000" fill="url(#grid)"/>

  <!-- Crop marks -->
  <g fill="none" stroke="#f1eee8" stroke-opacity=".5" stroke-width="2">
    <path d="M60 100V60H100"/>
    <path d="M1400 60H1440V100"/>
    <path d="M60 900V940H100"/>
    <path d="M1400 940H1440V900"/>
  </g>

  <!-- Single-line circuit, drawn in brass -->
  <g fill="none" stroke="#b8976a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 420H560"/>
    <path d="M560 420l40-40"/>
    <path d="M610 420H900V320H1250"/>
    <path d="M900 420V520H1250"/>
    <path d="M1000 320v-30M1100 320v-30M1200 320v-30"/>
    <path d="M1000 520v30M1100 520v30M1200 520v30"/>
  </g>
  <g fill="#2c2829" stroke="#b8976a" stroke-width="3">
    <circle cx="250" cy="420" r="9"/>
    <circle cx="560" cy="420" r="7"/>
    <circle cx="610" cy="420" r="7"/>
    <circle cx="900" cy="420" r="9"/>
    <circle cx="1250" cy="320" r="9"/>
    <circle cx="1250" cy="520" r="9"/>
  </g>

  <!-- Title block -->
  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" fill="#f1eee8">
    <text x="250" y="720" font-size="30" fill="#b8976a" letter-spacing="2">02 / INSPIRE ELECTRICAL</text>
    <text x="250" y="800" font-size="76" letter-spacing="10">COMING SOON</text>
    <text x="250" y="856" font-size="28" fill-opacity=".6" letter-spacing="2">First projects published from 2027</text>
  </g>
</svg>
